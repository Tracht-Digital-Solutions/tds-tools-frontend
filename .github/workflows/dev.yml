name: Dev build → dev branch

# On every push to main, build with the Staging/Demo config (PUBLIC_DEMO_MODE=
# true → static fallback catalog, ads off) and force-publish dist/ to the orphan
# `dev` branch. NOT deployed — developer artifact + push-to-main build gate.
# Production goes out via release.yml (manual). Pipeline body in _build.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      demo_mode: true
      publish_branch: dev
    secrets: inherit
