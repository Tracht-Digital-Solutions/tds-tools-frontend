name: Deploy → release branch (push + manual + dispatch)

# Production deploy. Runs on every push to main, on the manual button, AND when a
# dependency package dispatches it (workflow_dispatch from a tds-tool-* / contract
# release). Builds with prod config (PUBLIC_DEMO_MODE=false → live catalog with
# static fallback), force-pushes dist/ to the orphan `release` branch, then pings
# DEPLOY_WEBHOOK_URL. Pipeline body in _build.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      demo_mode: false
      publish_branch: release
      deploy: true
    secrets: inherit
